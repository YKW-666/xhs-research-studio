name: 问题反馈 / Bug report
description: 安装、搜索、视频读取或转录问题（请脱敏）
body:
  - type: markdown
    attributes:
      value: 请勿上传 Cookie、完整登录链接、浏览器目录或未经允许的视频。
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 项目版本、Windows、Node、Python 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与脱敏错误
      description: 使用的命令、期望结果、实际结果；移除访问参数和个人信息。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 补充说明或改进建议
